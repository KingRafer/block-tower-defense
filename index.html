<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Tower Defense</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1b1f2a;color:#fff;font-family:"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none}
  #wrap{width:100%;max-width:1100px;padding:8px}
  #top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .stat{background:#2b3245;border:3px solid #11141c;border-radius:8px;padding:6px 12px;font-weight:800;font-size:16px}
  .stat b{color:#ffd54f}
  #hp b{color:#ef5350}
  .btn{background:#43a047;border:3px solid #11141c;border-bottom-width:6px;border-radius:8px;color:#fff;font-weight:800;font-size:15px;padding:6px 14px;cursor:pointer}
  .btn:active{transform:translateY(2px);border-bottom-width:4px}
  .btn.gray{background:#546e7a}.btn.blue{background:#1e88e5}.btn.red{background:#e53935}.btn.on{background:#fb8c00}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  #stage{position:relative}
  canvas{width:100%;display:block;border:4px solid #11141c;border-radius:10px;background:#3e8e41;touch-action:none}
  #bar{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .slot{width:96px;background:#2b3245;border:3px solid #11141c;border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;position:relative}
  .slot:hover{background:#36405a}.slot.sel{background:#fb8c00}.slot.poor{opacity:.5}
  .slot .ico{width:34px;height:34px;margin:0 auto 4px;border:3px solid #11141c;border-radius:6px}
  .slot .nm{font-size:12px;font-weight:800}.slot .pr{font-size:13px;color:#ffd54f;font-weight:800}
  .slot .key{position:absolute;top:2px;left:6px;font-size:11px;opacity:.7}
  #panel{position:absolute;left:10px;bottom:10px;width:230px;background:rgba(27,31,42,.94);border:3px solid #11141c;border-radius:10px;padding:10px;display:none;font-size:13px}
  #panel h3{font-size:17px;margin-bottom:4px}
  #panel .row{display:flex;justify-content:space-between;margin:2px 0}
  #panel .btn{width:100%;margin-top:6px;font-size:14px}
  #msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;text-shadow:0 4px 0 #000;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s}
  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:10px}
  #overlay h1{font-size:46px;text-shadow:0 5px 0 #000}
  #overlay p{max-width:520px;text-align:center;opacity:.9;line-height:1.5}
  #overlay{overflow:auto;padding:16px;background:rgba(10,14,24,.82)}
  #overlay .sub{opacity:.75;margin-top:-8px}
  .mbtn{width:260px;font-size:20px;padding:10px}
  .mcol{display:flex;flex-direction:column;gap:10px;align-items:center}
  .cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .card{background:#2b3245;border:3px solid #11141c;border-radius:10px;padding:8px;cursor:pointer;width:210px;text-align:center}
  .card:hover{background:#36405a}.card.sel{border-color:#ffd54f;background:#3d4766}
  .card canvas{width:100%;border:2px solid #11141c;border-radius:6px;margin-bottom:4px}
  .card .nm{font-weight:800}.card small{opacity:.7}
  .diffs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .diffs .btn{min-width:150px;opacity:.55}.diffs .btn.sel{opacity:1;outline:3px solid #fff}
  .box{background:#2b3245;border:3px solid #11141c;border-radius:10px;padding:12px 16px;max-width:640px;width:100%;font-size:14px;line-height:1.5}
  .box table{width:100%;border-collapse:collapse}.box td,.box th{padding:3px 6px;border-bottom:1px solid #3d4766;text-align:left}
  .tog{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #3d4766}
  .tog .btn{min-width:80px;font-size:13px;padding:4px 10px}
  .badge{background:#ffd54f;color:#000;font-weight:900;padding:3px 10px;border-radius:6px}
  .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #help{font-size:12px;opacity:.6;margin-top:6px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div class="stat" id="cash">💰 $<b>0</b></div>
    <div class="stat" id="wave">🌊 Wave <b>0</b>/30</div>
    <div class="stat" id="hp">❤️ <b>100</b></div>
    <div class="stat" id="enem">👾 <b>0</b></div>
    <div style="flex:1"></div>
    <button class="btn" id="startBtn">▶ Mulai Wave</button>
    <button class="btn gray" id="skipBtn" title="Mulai wave berikutnya otomatis">Auto Skip: OFF</button>
    <button class="btn blue" id="speedBtn">⏩ 1x</button>
    <button class="btn gray" id="pauseBtn" title="Pause (Esc)">⏸</button>
  </div>
  <div id="stage">
    <canvas id="c" width="960" height="576"></canvas>
    <div id="panel"></div>
    <div id="msg"></div>
    <div id="overlay">
    </div>
  </div>
  <div id="bar"></div>
  <div id="help">Klik slot / tekan 1–6 untuk memilih tower • Klik peta untuk memasang • Klik tower untuk upgrade/jual • Klik kanan / Esc untuk batal • Q upgrade • X jual</div>
</div>
<script>
// ======================= KONFIGURASI =======================
const T = 48, COLS = 20, ROWS = 12, W = COLS * T, H = ROWS * T;
const MAPS = [
  { id:'grass', name:'Padang Rumput', diff:'⭐', path:[[-1,2],[4,2],[4,8],[9,8],[9,3],[14,3],[14,9],[18,9],[18,5],[21,5]],
    th:{g1:'#4caf50',g2:'#46a34a',p1:'#a1887f',p2:'#9c7f72',tree:'#2e7d32',rock:'#9e9e9e',bg:'#3e8e41'} },
  { id:'desert', name:'Gurun Pasir', diff:'⭐⭐', path:[[-1,9],[3,9],[3,2],[7,2],[7,10],[12,10],[12,1],[16,1],[16,7],[21,7]],
    th:{g1:'#e6c27a',g2:'#dfb96d',p1:'#b5835a',p2:'#ad7b52',tree:'#558b2f',rock:'#a1887f',bg:'#c9a35c',cactus:true} },
  { id:'snow', name:'Kutub Salju', diff:'⭐⭐⭐', path:[[-1,5],[2,5],[2,1],[6,1],[6,10],[10,10],[10,5],[13,5],[13,1],[17,1],[17,10],[21,10]],
    th:{g1:'#eef3f7',g2:'#e1e9ef',p1:'#90a4ae',p2:'#869aa5',tree:'#1b5e20',rock:'#b0bec5',bg:'#cfd8dc'} },
];
const DIFFS = {
  easy:   { name:'Mudah',  cash:800, hp:150, hpMul:0.7, waves:20, reward:1.2,  color:'#43a047' },
  normal: { name:'Normal', cash:600, hp:100, hpMul:1.0, waves:30, reward:1.0,  color:'#fb8c00' },
  hard:   { name:'Sulit',  cash:500, hp:75,  hpMul:1.4, waves:40, reward:0.85, color:'#e53935' },
};
let MAP = MAPS[0], PATH, DIFF = 'normal';

const TOWERS = {
  scout: { name:'Scout', color:'#43a047', limit:8, levels:[
    {cost:200, dmg:2, range:3.0, rate:0.9},
    {cost:150, dmg:3, range:3.3, rate:0.8},
    {cost:400, dmg:4, range:3.5, rate:0.6, hidden:true},
    {cost:900, dmg:7, range:3.8, rate:0.5, hidden:true},
    {cost:2000,dmg:12,range:4.2, rate:0.4, hidden:true}]},
  sniper: { name:'Sniper', color:'#6d4c41', limit:6, levels:[
    {cost:350, dmg:8,  range:7, rate:2.5},
    {cost:300, dmg:14, range:8, rate:2.3},
    {cost:800, dmg:25, range:9, rate:2.0, hidden:true},
    {cost:1800,dmg:50, range:10,rate:1.7, hidden:true, pierceArmor:true},
    {cost:4000,dmg:110,range:11,rate:1.4, hidden:true, pierceArmor:true}]},
  demoman: { name:'Demoman', color:'#e53935', limit:6, levels:[
    {cost:450, dmg:5,  range:3.2, rate:2.2, splash:1.1},
    {cost:350, dmg:8,  range:3.4, rate:2.0, splash:1.2},
    {cost:900, dmg:14, range:3.6, rate:1.8, splash:1.4},
    {cost:2200,dmg:26, range:3.9, rate:1.5, splash:1.6, pierceArmor:true},
    {cost:5000,dmg:55, range:4.3, rate:1.2, splash:1.9, pierceArmor:true}]},
  freezer: { name:'Freezer', color:'#29b6f6', limit:4, levels:[
    {cost:400, dmg:1, range:2.6, rate:1.2, slow:0.35},
    {cost:300, dmg:1, range:2.9, rate:1.0, slow:0.45},
    {cost:700, dmg:2, range:3.2, rate:0.9, slow:0.55, hidden:true},
    {cost:1500,dmg:4, range:3.5, rate:0.8, slow:0.62, hidden:true}]},
  minigun: { name:'Minigunner', color:'#546e7a', limit:5, levels:[
    {cost:1200,dmg:2, range:3.5, rate:0.15},
    {cost:800, dmg:3, range:3.7, rate:0.13},
    {cost:2000,dmg:4, range:4.0, rate:0.11, hidden:true},
    {cost:4500,dmg:7, range:4.3, rate:0.09, hidden:true},
    {cost:9000,dmg:12,range:4.6, rate:0.07, hidden:true, pierceArmor:true}]},
  farm: { name:'Farm', color:'#fdd835', limit:6, levels:[
    {cost:250, income:50},
    {cost:200, income:100},
    {cost:550, income:250},
    {cost:1200,income:500},
    {cost:2500,income:900}]},
};
const ORDER = ['scout','sniper','demoman','freezer','minigun','farm'];

const ENEMIES = {
  normal:  {hp:6,   spd:1.2, reward:4,  color:'#7cb342', size:0.55},
  fast:    {hp:4,   spd:2.4, reward:4,  color:'#fbc02d', size:0.45},
  tank:    {hp:30,  spd:0.8, reward:10, color:'#8d6e63', size:0.7, armor:0.25},
  hidden:  {hp:10,  spd:1.6, reward:8,  color:'#b0bec5', size:0.5, hidden:true},
  armored: {hp:45,  spd:1.0, reward:16, color:'#607d8b', size:0.65, armor:0.5},
  boss:    {hp:700, spd:0.55,reward:300,color:'#6a1b9a', size:1.1, armor:0.2, boss:true},
};

// ======================= STATE =======================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let S; // game state
let pathPx, pathTiles, deco;
function computeTiles(path){
  const set=new Set();
  for (let i=0;i<path.length-1;i++){
    let [c1,r1]=path[i],[c2,r2]=path[i+1];
    const dc=Math.sign(c2-c1), dr=Math.sign(r2-r1);
    while(c1!==c2||r1!==r2){ set.add(c1+','+r1); c1+=dc; r1+=dr; }
    set.add(c2+','+r2);
  }
  return set;
}
function computeDeco(tiles,seed){
  const out=[]; const rnd=()=>((seed=seed*16807%2147483647)/2147483647);
  for(let i=0;i<26;i++){ const c=Math.floor(rnd()*COLS), r=Math.floor(rnd()*ROWS);
    if(!tiles.has(c+','+r) && c<18 && !out.some(d=>d.c===c&&d.r===r)) out.push({c,r,type:rnd()<0.7?'tree':'rock'}); }
  return out;
}
function loadMap(m){
  MAP=m; PATH=m.path;
  pathPx = PATH.map(([c,r]) => ({x:(c+0.5)*T, y:(r+0.5)*T}));
  pathTiles = computeTiles(PATH); deco = computeDeco(pathTiles, 7+MAPS.indexOf(m)*13);
  cv.style.background=m.th.bg;
}

// ======================= SAVE: PENGATURAN & STATISTIK =======================
function load(k,def){ try{ return Object.assign(def, JSON.parse(localStorage.getItem(k)||'{}')); }catch(e){ return def; } }
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const SET = load('btd_settings', { sound:true, volume:0.5, dmgNum:true, shake:true, grid:false, range:true });
const STATS = load('btd_stats', { games:0, wins:0, kills:0, bossKills:0, towersPlaced:0, cashEarned:0, best:{} });

// ======================= SUARA (WebAudio) =======================
let AC=null; const lastSfx={};
function sfx(type){
  if(!SET.sound) return;
  const now=performance.now(); if(lastSfx[type] && now-lastSfx[type]<60) return; lastSfx[type]=now;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const P={shoot:[880,0.04,'square',0.05], snipe:[220,0.12,'sawtooth',0.12], boom:[90,0.3,'sawtooth',0.2],
      place:[520,0.1,'triangle',0.2], upgrade:[660,0.18,'triangle',0.2], sell:[330,0.12,'triangle',0.2],
      leak:[120,0.25,'square',0.2], wave:[440,0.3,'triangle',0.2], click:[700,0.05,'triangle',0.12],
      win:[784,0.6,'triangle',0.25], lose:[110,0.8,'sawtooth',0.25], freeze:[1200,0.06,'sine',0.08]}[type];
    if(!P) return;
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=P[2]; o.frequency.setValueAtTime(P[0],t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,P[0]*(type==='win'?1.5:0.5)),t+P[1]);
    g.gain.setValueAtTime(P[3]*SET.volume,t); g.gain.exponentialRampToValueAtTime(0.001,t+P[1]);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+P[1]+0.02);
  }catch(e){}
}

function newGame(){
  const D=DIFFS[DIFF];
  loadMap(MAP);
  S = { cash:D.cash, hp:D.hp, maxHp:D.hp, wave:0, maxWave:D.waves, state:'ready', speed:1, autoSkip:S?S.autoSkip:false,
        towers:[], enemies:[], projectiles:[], effects:[], texts:[], spawnQ:[], waveTime:0, earned:0,
        placing:null, selected:null, mouse:{x:-99,y:-99,in:false}, time:0, autoTimer:0, kills:0, recorded:false };
  updateUI(); renderBar(); hidePanel();
}

// ======================= WAVE =======================
function buildWave(n){
  const q=[]; let t=0;
  const add=(type,count,gap)=>{ for(let i=0;i<count;i++){ q.push({type,t}); t+=gap; } t+=0.8; };
  add('normal', Math.floor(4+n*1.4), Math.max(0.35,1.0-n*0.02));
  if(n>=3)  add('fast', Math.floor(2+n*0.8), 0.45);
  if(n>=5)  add('tank', Math.floor(1+n*0.35), 1.1);
  if(n>=7)  add('hidden', Math.floor(2+(n-6)*0.6), 0.7);
  if(n>=12) add('armored', Math.floor(1+(n-11)*0.5), 1.2);
  if(n>=16) add('fast', Math.floor(n), 0.25);
  if(n%10===0) add('boss', n/10, 4);
  return q;
}
function startWave(){
  if(!S || S.state!=='ready' || S.wave>=S.maxWave) return;
  S.wave++; S.state='wave'; S.spawnQ=buildWave(S.wave); S.waveTime=0; sfx('wave');
  flash(S.wave%10===0 ? `⚠️ BOSS WAVE ${S.wave}` : `WAVE ${S.wave}`);
  updateUI();
}
function spawn(type){
  const d=ENEMIES[type], w=S.wave;
  let hp=d.hp*(1+w*0.13+Math.pow(w,1.6)*0.01);
  if(d.boss) hp=d.hp*Math.pow(w/10,2.1)*(1+w*0.05);
  hp*=DIFFS[DIFF].hpMul;
  S.enemies.push({type, ...d, reward:Math.round(d.reward*DIFFS[DIFF].reward), maxHp:hp, hp, x:pathPx[0].x, y:pathPx[0].y, wp:1, dist:0,
                  slowUntil:0, slowF:0, id:Math.random(), wob:Math.random()*6});
}
function endWave(){
  const bonus=100+S.wave*30; let farm=0;
  S.towers.filter(t=>t.type==='farm').forEach(t=>{ const inc=lvl(t).income; farm+=inc; addText(t.x,t.y-20,'+$'+inc,'#ffd54f'); });
  S.cash+=bonus+farm; S.earned+=bonus+farm;
  if(S.wave>=S.maxWave){ S.state='win'; finishGame(true); return; }
  S.state='ready'; S.autoTimer=3;
  flash(`Wave selesai! +$${bonus+farm}`, 1200);
  updateUI(); renderBar();
}

// ======================= TOWER =======================
const lvl = t => TOWERS[t.type].levels[t.level];
const tileFree = (c,r) => c>=0&&r>=0&&c<COLS&&r<ROWS && !pathTiles.has(c+','+r) && !S.towers.some(t=>t.c===c&&t.r===r) && !deco.some(d=>d.c===c&&d.r===r);
function countType(type){ return S.towers.filter(t=>t.type===type).length; }
function placeTower(type,c,r){
  const def=TOWERS[type], cost=def.levels[0].cost;
  if(S.cash<cost || !tileFree(c,r) || countType(type)>=def.limit) return false;
  S.cash-=cost;
  const t={type,c,r,x:(c+0.5)*T,y:(r+0.5)*T,level:0,cd:0,angle:0,spent:cost,target:'first',recoil:0};
  S.towers.push(t); STATS.towersPlaced++; sfx('place'); puff(t.x,t.y,'#fff'); updateUI(); renderBar();
  return t;
}
function upgrade(t){
  const def=TOWERS[t.type]; if(t.level>=def.levels.length-1) return;
  const cost=def.levels[t.level+1].cost; if(S.cash<cost) return;
  S.cash-=cost; t.spent+=cost; t.level++; sfx('upgrade'); puff(t.x,t.y,'#ffd54f'); addText(t.x,t.y-24,'UPGRADE!','#ffd54f');
  updateUI(); showPanel(t); renderBar();
}
function sell(t){
  const v=Math.floor(t.spent*0.6); S.cash+=v; sfx('sell'); S.towers=S.towers.filter(x=>x!==t);
  addText(t.x,t.y,'+$'+v,'#ffd54f'); puff(t.x,t.y,'#aaa'); hidePanel(); S.selected=null; updateUI(); renderBar();
}
const MODES=['first','last','strong','close'], MODE_LBL={first:'Pertama',last:'Terakhir',strong:'Terkuat',close:'Terdekat'};
function pickTarget(t,L){
  const R=L.range*T; let best=null, bv=-Infinity;
  for(const e of S.enemies){
    if(e.hp<=0) continue;
    if(e.hidden && !L.hidden) continue;
    const d=Math.hypot(e.x-t.x,e.y-t.y); if(d>R) continue;
    let v = t.target==='first'?e.dist : t.target==='last'?-e.dist : t.target==='strong'?e.hp : -d;
    if(v>bv){bv=v;best=e;}
  }
  return best;
}
function damage(e,amt,L){
  let a=amt; if(e.armor && !L.pierceArmor) a*= (1-e.armor);
  e.hp-=a; if(SET.dmgNum) addText(e.x+(Math.random()*16-8), e.y-20, Math.round(a*10)/10, '#fff', 0.5);
  if(e.hp<=0 && !e.dead){ e.dead=true; S.cash+=e.reward; S.earned+=e.reward; S.kills++; if(e.boss) STATS.bossKills++; puff(e.x,e.y,e.color,e.boss?24:8); }
}

// ======================= UPDATE =======================
function update(dt){
  S.time+=dt;
  if(S.state==='ready' && S.autoSkip && S.wave>0){ S.autoTimer-=dt; if(S.autoTimer<=0) startWave(); }
  if(S.state==='wave'){
    S.waveTime+=dt;
    while(S.spawnQ.length && S.spawnQ[0].t<=S.waveTime) spawn(S.spawnQ.shift().type);
  }
  // musuh
  for(const e of S.enemies){
    if(e.dead) continue;
    let sp=e.spd*T*(S.time<e.slowUntil?(1-e.slowF):1), move=sp*dt;
    while(move>0 && e.wp<pathPx.length){
      const p=pathPx[e.wp], dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy);
      if(d<=move){ e.x=p.x; e.y=p.y; move-=d; e.dist+=d; e.wp++; }
      else { e.x+=dx/d*move; e.y+=dy/d*move; e.dist+=move; e.dir=Math.atan2(dy,dx); move=0; }
    }
    if(e.wp>=pathPx.length){ e.dead=true; e.leaked=true; const dmg=e.boss?999:Math.ceil(e.hp); S.hp-=dmg; sfx('leak'); if(SET.shake) shake=8; addText(W-60,(PATH[PATH.length-1][1]+0.5)*T,'-'+dmg,'#ef5350',1.2); }
  }
  S.enemies=S.enemies.filter(e=>!e.dead);
  // tower
  for(const t of S.towers){
    if(t.type==='farm') continue;
    const L=lvl(t); t.cd-=dt; t.recoil=Math.max(0,t.recoil-dt*6);
    const tg=pickTarget(t,L);
    if(tg){ t.angle=Math.atan2(tg.y-t.y,tg.x-t.x);
      if(t.cd<=0){ t.cd=L.rate; t.recoil=1; fire(t,L,tg); } }
  }
  // proyektil (roket)
  for(const p of S.projectiles){
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy), mv=9*T*dt;
    if(p.target && !p.target.dead){ p.tx=p.target.x; p.ty=p.target.y; }
    if(d<=mv){ p.done=true; explode(p); } else { p.x+=dx/d*mv; p.y+=dy/d*mv; p.a=Math.atan2(dy,dx); }
  }
  S.projectiles=S.projectiles.filter(p=>!p.done);
  S.effects.forEach(f=>f.life-=dt); S.effects=S.effects.filter(f=>f.life>0);
  S.texts.forEach(x=>{x.life-=dt; x.y-=30*dt;}); S.texts=S.texts.filter(x=>x.life>0);
  if(S.hp<=0 && S.state!=='lose'){ S.hp=0; S.state='lose'; finishGame(false); }
  if(S.state==='wave' && !S.spawnQ.length && !S.enemies.length) endWave();
}
function fire(t,L,e){
  const mx=t.x+Math.cos(t.angle)*22, my=t.y-14+Math.sin(t.angle)*22;
  sfx(t.type==='sniper'?'snipe':t.type==='freezer'?'freeze':'shoot');
  if(t.type==='demoman'){ S.projectiles.push({x:mx,y:my,tx:e.x,ty:e.y,target:e,L,a:t.angle}); return; }
  const col = t.type==='freezer'?'#81d4fa' : t.type==='sniper'?'#fff59d' : '#ffeb3b';
  S.effects.push({kind:'tracer',x1:mx,y1:my,x2:e.x,y2:e.y-8,life:t.type==='sniper'?0.15:0.06,max:0.15,col,w:t.type==='sniper'?3:2});
  if(L.slow){ const f=e.boss?L.slow/2:L.slow; e.slowF=Math.max(S.time<e.slowUntil?e.slowF:0,f); e.slowUntil=S.time+2; }
  damage(e,L.dmg,L);
}
function explode(p){
  const R=p.L.splash*T;
  S.effects.push({kind:'boom',x:p.tx,y:p.ty,r:R,life:0.35,max:0.35}); sfx('boom');
  for(const e of S.enemies){ if(e.dead) continue; if(Math.hypot(e.x-p.tx,e.y-p.ty)<=R) damage(e,p.L.dmg,p.L); }
}
function puff(x,y,col,n=8){ for(let i=0;i<n;i++) S.effects.push({kind:'part',x,y,vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160-40,col,life:0.5,max:0.5,s:4+Math.random()*5}); }
function addText(x,y,txt,col,life=0.8){ S.texts.push({x,y,txt,col,life,max:life}); }

// ======================= RENDER =======================
let shake=0;
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return `rgb(${r},${g},${b})`; }
// balok gaya Roblox: sisi depan + atas
function block(x,y,w,h,depth,color){
  ctx.fillStyle=shade(color,-55); ctx.fillRect(x,y+h-depth,w,depth+depth);
  ctx.fillStyle=color; ctx.fillRect(x,y-depth,w,h);
  ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(x,y-depth,w,4);
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=2; ctx.strokeRect(x,y-depth,w,h+depth);
}
function drawMap(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const isP=pathTiles.has(c+','+r);
    const th=MAP.th; ctx.fillStyle = isP ? ((c+r)%2?th.p1:th.p2) : ((c+r)%2?th.g1:th.g2);
    ctx.fillRect(c*T,r*T,T,T);
    if(SET.grid){ ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1; ctx.strokeRect(c*T,r*T,T,T); }
    if(isP){ ctx.fillStyle='rgba(0,0,0,.08)'; ctx.fillRect(c*T+6,r*T+6,10,6); ctx.fillRect(c*T+28,r*T+30,12,6); }
  }
  // tepi jalur
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2;
  pathTiles.forEach(k=>{ const [c,r]=k.split(',').map(Number); if(c<0||c>=COLS) return;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc,dr])=>{ if(!pathTiles.has((c+dc)+','+(r+dr))){ ctx.beginPath();
      const x=c*T,y=r*T; if(dc===1){ctx.moveTo(x+T,y);ctx.lineTo(x+T,y+T);} if(dc===-1){ctx.moveTo(x,y);ctx.lineTo(x,y+T);}
      if(dr===1){ctx.moveTo(x,y+T);ctx.lineTo(x+T,y+T);} if(dr===-1){ctx.moveTo(x,y);ctx.lineTo(x+T,y);} ctx.stroke(); } }); });
  // spawn portal
  ctx.fillStyle='#212121'; ctx.fillRect(0,PATH[0][1]*T+4,10,T-8);
  // base
  const bx=19*T+2, by=(PATH[PATH.length-1][1]-1)*T+6; block(bx-6,by,T+4,T*2-10,10,'#90a4ae'); block(bx+2,by-14,T-12,22,6,'#e53935');
  ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.textAlign='center'; ctx.fillText('BASE',bx+16,by+40);
  for(const d of deco){ const x=d.c*T, y=d.r*T;
    if(d.type==='tree' && MAP.th.cactus){ block(x+18,y+8,12,32,4,MAP.th.tree); block(x+8,y+16,8,12,3,MAP.th.tree); block(x+32,y+12,8,12,3,MAP.th.tree); }
    else if(d.type==='tree'){ block(x+19,y+26,10,18,4,'#6d4c41'); block(x+8,y+12,32,22,10,MAP.th.tree); if(MAP.id==='snow'){ ctx.fillStyle='#fff'; ctx.fillRect(x+8,y+2,32,6);} }
    else block(x+10,y+20,28,18,8,MAP.th.rock); }
}
function drawTower(t){
  const def=TOWERS[t.type], x=t.x, y=t.y, L=t.level;
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x,y+16,20,7,0,0,Math.PI*2); ctx.fill();
  block(x-19,y+4,38,12,6,'#78909c'); // alas
  if(t.type==='farm'){
    block(x-16,y-14,32,22,10,'#c62828'); ctx.fillStyle='#5d4037'; ctx.beginPath(); ctx.moveTo(x-20,y-24); ctx.lineTo(x,y-38); ctx.lineTo(x+20,y-24); ctx.fill();
    ctx.fillStyle='#ffd54f'; ctx.font='bold 14px Arial'; ctx.textAlign='center'; ctx.fillText('$',x,y-2);
  } else {
    // badan noob
    block(x-11,y-6,22,14,5,def.color);
    block(x-8,y-22,16,14,5,'#fdd835'); // kepala
    ctx.fillStyle='#000'; ctx.fillRect(x-5,y-22,3,3); ctx.fillRect(x+2,y-22,3,3);
    // senjata
    ctx.save(); ctx.translate(x,y-8); ctx.rotate(t.angle); const rc=t.recoil*4;
    const gl = t.type==='sniper'?30 : t.type==='minigun'?24 : t.type==='demoman'?18 : 18;
    const gw = t.type==='minigun'?9 : t.type==='demoman'?10 : 6;
    ctx.fillStyle= t.type==='freezer'?'#4fc3f7':'#263238'; ctx.fillRect(4-rc,-gw/2,gl,gw);
    ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(4-rc,-gw/2,gl,gw);
    ctx.restore();
  }
  // bintang level
  for(let i=0;i<L;i++){ ctx.fillStyle='#ffd54f'; ctx.fillRect(x-14+i*8,y+18,6,6); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.strokeRect(x-14+i*8,y+18,6,6); }
}
function drawEnemy(e){
  const s=e.size*T, x=e.x, y=e.y, bob=Math.sin(S.time*10+e.wob)*2;
  ctx.globalAlpha = e.hidden?0.5:1;
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x,y+s*0.35,s*0.45,s*0.15,0,0,Math.PI*2); ctx.fill();
  block(x-s*0.35,y-s*0.1+bob,s*0.7,s*0.45,s*0.12,e.color);  // badan
  block(x-s*0.25,y-s*0.55+bob,s*0.5,s*0.38,s*0.1,e.boss?'#9c27b0':shade(e.color,30)); // kepala
  ctx.fillStyle = e.boss?'#ffeb3b':'#b71c1c';
  ctx.fillRect(x-s*0.14,y-s*0.5+bob,s*0.09,s*0.09); ctx.fillRect(x+s*0.05,y-s*0.5+bob,s*0.09,s*0.09);
  if(e.armor){ ctx.fillStyle='rgba(176,190,197,.8)'; ctx.fillRect(x-s*0.27,y-s*0.72+bob,s*0.54,s*0.12); }
  ctx.globalAlpha=1;
  if(S.time<e.slowUntil){ ctx.fillStyle='rgba(129,212,250,.35)'; ctx.fillRect(x-s*0.4,y-s*0.7+bob,s*0.8,s*1.05); }
  // HP bar
  const bw=Math.max(30,s), pct=Math.max(0,e.hp/e.maxHp);
  ctx.fillStyle='#000'; ctx.fillRect(x-bw/2-1,y-s*0.85-1,bw+2,7);
  ctx.fillStyle=pct>0.5?'#66bb6a':pct>0.25?'#ffca28':'#ef5350'; ctx.fillRect(x-bw/2,y-s*0.85,bw*pct,5);
}
function draw(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.85; if(shake<0.5) shake=0; }
  drawMap();
  // range tower yang dipilih
  if(SET.range && S.selected && S.selected.type!=='farm') ring(S.selected.x,S.selected.y,lvl(S.selected).range*T,'rgba(255,255,255,.15)','rgba(255,255,255,.7)');
  // gambar berurutan menurut y (pseudo-3D)
  const objs=[...S.towers.map(t=>({y:t.y,f:()=>drawTower(t)})), ...S.enemies.map(e=>({y:e.y,f:()=>drawEnemy(e)}))];
  objs.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  for(const p of S.projectiles){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle='#424242'; ctx.fillRect(-7,-3,14,6); ctx.fillStyle='#ff7043'; ctx.fillRect(-11,-2,4,4); ctx.restore(); }
  for(const f of S.effects){
    const k=f.life/f.max;
    if(f.kind==='tracer'){ ctx.strokeStyle=f.col; ctx.globalAlpha=k; ctx.lineWidth=f.w; ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke(); ctx.globalAlpha=1; }
    if(f.kind==='boom'){ ctx.globalAlpha=k; ctx.fillStyle='#ff9800'; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1.2-k*0.5),0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffeb3b'; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*0.5*(1.2-k*0.5),0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    if(f.kind==='part'){ f.x+=f.vx*0.016; f.y+=f.vy*0.016; f.vy+=6; ctx.globalAlpha=k; ctx.fillStyle=f.col; ctx.fillRect(f.x,f.y,f.s,f.s); ctx.globalAlpha=1; }
  }
  // preview penempatan
  if(S.placing && S.mouse.in){
    const c=Math.floor(S.mouse.x/T), r=Math.floor(S.mouse.y/T), ok=tileFree(c,r) && S.cash>=TOWERS[S.placing].levels[0].cost;
    const def=TOWERS[S.placing];
    ctx.fillStyle=ok?'rgba(255,255,255,.3)':'rgba(244,67,54,.4)'; ctx.fillRect(c*T,r*T,T,T);
    if(def.levels[0].range) ring((c+0.5)*T,(r+0.5)*T,def.levels[0].range*T, ok?'rgba(255,255,255,.12)':'rgba(244,67,54,.12)', ok?'rgba(255,255,255,.6)':'rgba(244,67,54,.7)');
    ctx.globalAlpha=0.6; drawTower({type:S.placing,x:(c+0.5)*T,y:(r+0.5)*T,level:0,angle:0,recoil:0}); ctx.globalAlpha=1;
  }
  ctx.textAlign='center';
  for(const x of S.texts){ ctx.globalAlpha=Math.min(1,x.life/x.max*2); ctx.font='bold 15px Arial'; ctx.lineWidth=3; ctx.strokeStyle='#000'; ctx.strokeText(x.txt,x.x,x.y); ctx.fillStyle=x.col; ctx.fillText(x.txt,x.x,x.y); }
  ctx.globalAlpha=1;
  if(S.state==='ready' && S.autoSkip && S.wave>0){ ctx.font='bold 18px Arial'; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=4; const tx=`Wave berikutnya dalam ${Math.ceil(S.autoTimer)}...`; ctx.strokeText(tx,W/2,30); ctx.fillText(tx,W/2,30); }
  ctx.restore();
}
function ring(x,y,r,fill,stroke){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.setLineDash([8,6]); ctx.stroke(); ctx.setLineDash([]); }

function showPanel(t){
  const def=TOWERS[t.type], L=lvl(t), next=def.levels[t.level+1];
  const st=(lab,a,b)=>`<div class="row"><span>${lab}</span><span>${a}${b!==undefined&&b!==a?` → <b style="color:#81c784">${b}</b>`:''}</span></div>`;
  let h=`<h3>${def.name} <span style="color:#ffd54f">Lv ${t.level}</span></h3>`;
  if(t.type==='farm') h+=st('Pendapatan/wave','$'+L.income,next&&'$'+next.income);
  else {
    h+=st('Damage',L.dmg,next&&next.dmg)+st('Range',L.range,next&&next.range)+st('Cooldown',L.rate+'s',next&&next.rate+'s');
    if(L.splash) h+=st('Splash',L.splash,next&&next.splash);

    h+=st('Tembus Armor',L.pierceArmor?'✅':'❌',next&&(next.pierceArmor?'✅':'❌'));
    h+=`<button class="btn blue" id="tgtBtn">🎯 Target: ${MODE_LBL[t.target]}</button>`;
  }
  h+= next ? `<button class="btn" id="upBtn" ${S.cash<next.cost?'disabled':''}>⬆ Upgrade ($${next.cost})</button>` : `<button class="btn" disabled>MAX LEVEL</button>`;
  h+=`<button class="btn red" id="sellBtn">Jual ($${Math.floor(t.spent*0.6)})</button>`;
  $('panel').innerHTML=h; $('panel').style.display='block';

  $('sellBtn').onclick=()=>sell(t);

}

    </div><button class="btn gray" onclick="go('main')">← Kembali</button>`,
  pause:()=>`<h1>⏸ PAUSE</h1><div class="sub">${MAP.name} • ${DIFFS[DIFF].name} • Wave ${S.wave}/${S.maxWave}</div><div class="mcol">
    <button class="btn mbtn" onclick="sfx('click');closeMenu()">▶ Lanjutkan</button>
    <button class="btn blue mbtn" onclick="startGame()">🔄 Ulangi</button>
    <button class="btn gray mbtn" onclick="menuBack='pause';go('settings')">⚙️ Pengaturan</button>
    <button class="btn red mbtn" onclick="newGame();go('main')">🏠 Menu Utama</button></div>`,
  end:()=>{ const d=endData; return `<h1>${d.win?'🏆 MENANG!':'💀 GAME OVER'}</h1>
    ${d.record?'<span class="badge">⭐ REKOR BARU!</span>':''}
    <div class="box" style="max-width:360px"><table>
    <tr><td>Map</td><td><b>${MAP.name}</b> (${DIFFS[DIFF].name})</td></tr><tr><td>Wave</td><td><b>${S.wave}/${S.maxWave}</b></td></tr>
    <tr><td>Musuh dikalahkan</td><td><b>${S.kills}</b></td></tr><tr><td>Uang didapat</td><td><b>$${S.earned}</b></td></tr>
    <tr><td>Tower</td><td><b>${S.towers.length}</b></td></tr><tr><td>Rekor</td><td><b>wave ${getBest(MAP.id,DIFF)}</b></td></tr></table></div>
    <div class="row2"><button class="btn" onclick="startGame()">🔄 Main Lagi</button><button class="btn blue" onclick="go('play')">🗺️ Pilih Map</button>
    <button class="btn gray" onclick="newGame();go('main')">🏠 Menu</button></div>`; },
};
const AFTER = { play:()=>document.querySelectorAll('canvas[data-map]').forEach(c=>drawPreview(c,MAPS[+c.dataset.map])) };
function drawPreview(c,m){
  const g=c.getContext('2d'), ts=c.width/COLS, tiles=computeTiles(m.path);
  for(let r=0;r<ROWS;r++) for(let x=0;x<COLS;x++){ const p=tiles.has(x+','+r);
    g.fillStyle=p?m.th.p1:((x+r)%2?m.th.g1:m.th.g2); g.fillRect(x*ts,r*ts,ts+0.5,ts+0.5); }
  g.fillStyle='#e53935'; const e=m.path[m.path.length-1]; g.fillRect(19*ts,(e[1]-1)*ts,ts,ts*2);
}
function resetData(){
  if(!resetArm){ resetArm=true; go('settings'); return; }
  resetArm=false; Object.assign(STATS,{games:0,wins:0,kills:0,bossKills:0,towersPlaced:0,cashEarned:0,best:{}}); store('btd_stats',STATS); go('settings');
}
function startGame(){ sfx('click'); newGame(); STATS.games++; store('btd_stats',STATS); closeMenu(); flash(`${MAP.name} • ${DIFFS[DIFF].name}`); }
function finishGame(win){
  if(S.recorded) return; S.recorded=true;
  const k=bestKey(MAP.id,DIFF), reached=win?S.wave:Math.max(0,S.wave-1), record=reached>(STATS.best[k]||0);
  if(record) STATS.best[k]=reached;
  if(win) STATS.wins++; STATS.kills+=S.kills; STATS.cashEarned+=S.earned; store('btd_stats',STATS);
  sfx(win?'win':'lose'); endData={win,record}; setTimeout(()=>menu('end'),700);
}

// ======================= INPUT =======================
function canvasPos(ev){ const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left)*W/r.width, y:(ev.clientY-r.top)*H/r.height}; }
cv.addEventListener('pointermove',ev=>{ const p=canvasPos(ev); S.mouse={...p,in:true}; });
cv.addEventListener('pointerleave',()=>S.mouse.in=false);
cv.addEventListener('pointerdown',ev=>{
  if(ev.button===2 || curScreen) return;
  const p=canvasPos(ev); S.mouse={...p,in:true}; const c=Math.floor(p.x/T), r=Math.floor(p.y/T);
  if(S.placing){ const t=placeTower(S.placing,c,r); if(t && !ev.shiftKey){ S.placing=null; renderBar(); } return; }
  const t=S.towers.find(t=>t.c===c&&t.r===r);
  if(t){ S.selected=t; showPanel(t); } else { S.selected=null; hidePanel(); }
});
cv.addEventListener('contextmenu',ev=>{ ev.preventDefault(); S.placing=null; S.selected=null; hidePanel(); renderBar(); });
addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if(curScreen==='pause') closeMenu();
    else if(!curScreen && (S.placing||S.selected)){ S.placing=null; S.selected=null; hidePanel(); renderBar(); }
    else if(!curScreen && S.state!=='win' && S.state!=='lose') menu('pause');
    return; }
  if(curScreen) return;
  if(ev.key>='1'&&ev.key<='6') selectPlace(ORDER[+ev.key-1]);
  if((ev.key==='q'||ev.key==='e') && S.selected) upgrade(S.selected);
  if(ev.key==='x' && S.selected) sell(S.selected);
  if(ev.key===' '){ ev.preventDefault(); startWave(); }
});
$('startBtn').onclick=startWave;
$('skipBtn').onclick=()=>{ S.autoSkip=!S.autoSkip; S.autoTimer=3; updateUI(); };
$('speedBtn').onclick=()=>{ S.speed=S.speed===1?2:S.speed===2?3:1; updateUI(); };
$('pauseBtn').onclick=()=>{ if(!curScreen && S.state!=='win' && S.state!=='lose') menu('pause'); };

// ======================= LOOP =======================
let last=performance.now(), uiT=0, lastCash=-1;
function loop(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!curScreen && S.state!=='win' && S.state!=='lose'){
    for(let i=0;i<S.speed;i++) update(dt);
  }
  draw();
  uiT+=dt; if(uiT>0.15){ uiT=0; updateUI();
    if(Math.floor(S.cash)!==lastCash){ lastCash=Math.floor(S.cash); renderBar(); if(S.selected) showPanel(S.selected); } }
  requestAnimationFrame(loop);
}
loadMap(MAP); newGame(); menu('main'); requestAnimationFrame(loop);
</script>
