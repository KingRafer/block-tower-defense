<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Block Tower Defense — game tower defense bergaya Roblox yang bisa dimainkan langsung di browser.">
  <meta name="theme-color" content="#151a26">
  <meta property="og:title" content="Block Tower Defense">
  <meta property="og:description" content="Pertahankan base dari gelombang zombie kotak! Game tower defense gratis di browser.">
  <meta property="og:image" content="docs/screenshot-game.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Block TD">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Block Tower Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="wrap">
    <header id="hud">
      <div class="stat cash"><span class="ic">💰</span><b id="hudCash">$0</b></div>
      <div class="stat wave"><span class="ic">🌊</span><div class="sv"><b>Wave <span id="hudWave">0/30</span></b><div class="bar"><div id="hudWaveBar"></div></div></div></div>
      <div class="stat hp"><span class="ic">❤️</span><div class="sv"><b id="hudHp">100</b><div class="bar"><div id="hudHpBar"></div></div></div></div>
      <div class="stat"><span class="ic">🧟</span><b id="hudEnemies">0</b></div>
      <div class="spacer"></div>
      <button class="btn" id="startBtn">▶ Mulai Wave</button>
      <button class="btn gold" id="skipWaveBtn" style="display:none" title="Mulai wave berikutnya sekarang">⏭ Skip</button>
      <button class="btn gray" id="skipBtn" title="Mulai wave berikutnya otomatis">Auto: OFF</button>
      <button class="btn blue" id="speedBtn" title="Kecepatan (F)">⏩ 1x</button>
      <button class="btn gray" id="fsBtn" title="Layar penuh">⛶</button>
      <button class="btn gray" id="pauseBtn" title="Pause (Esc)">⏸</button>
    </header>
    <div id="preview"></div>
    <main id="stage">
      <canvas id="game" width="960" height="576" aria-label="Arena permainan"></canvas>
      <aside id="panel"></aside>
      <div id="banner"></div>
      <div id="mpPlayers"></div>
      <div id="chat"><div id="chatLog"></div><input id="chatIn" placeholder="Enter untuk chat…" maxlength="140" autocomplete="off"></div>
    </main>
    <div id="bottom"><div id="abilities"></div><nav id="bar"></nav></div>
    <div id="tooltip"></div>
  </div>
  <div id="rotateHint"><span>📱↻</span><div><b>Putar HP ke mode landscape</b><small>Agar arena lebih besar & mudah dimainkan</small></div><button id="rotateClose">✕</button></div>
  <div id="overlay"></div>
  <div id="toasts"></div>

  <script src="js/shared.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/chars.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/dev.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/online.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
